<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon" />
    <meta name="description"
        content="Start a project with Jose Camargo for automation, AI workflows, CRM operations, WhatsApp systems, voice agents, or infrastructure setup." />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Jose Camargo | Contact</title>
</head>

<body class="subPage contactPage">
    <header>
        <a href="../index.html"><img src="../img/logo.png" alt="Logo de JC DEV" class="logo" /></a>
        <button class="abrirMenu" id="abrir" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <nav class="nav" id="nav">
            <button class="cerrarMenu" id="cerrar" aria-label="Close menu"><i class="bi bi-x-lg"></i></button>
            <ul class="navList">
                <li><a href="../index.html" data-i18n="nav_home">Home</a></li>
                <li><a href="about.html" data-i18n="nav_about">About</a></li>
                <li><a href="projects.html" data-i18n="nav_projects">Projects</a></li>
                <li><a href="contact.html" data-i18n="nav_contact">Contact</a></li>
                <li class="navLangItem">
                    <div class="langSwitch" role="group" aria-label="Language switch">
                        <button class="langSwitchButton" type="button" data-lang-button="es" aria-pressed="false">ES</button>
                        <button class="langSwitchButton" type="button" data-lang-button="en" aria-pressed="true">EN</button>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <main class="contentPage pageShell editorialPage">
        <section class="contactShowroom" data-reveal>
            <form class="contactForm contactFormCentered contactFormClean" id="contactForm"
                data-webhook-url="https://engine.marpicorp.com/webhook/6738f883-a0ba-45b4-819d-ad875da7e940"
                data-recaptcha-sitekey="6LchXJYsAAAAAO4X2A_4MExA_DE0tekLV_lt3rJr">
                <p class="formBadge" data-i18n="contact_badge">Start a Project</p>
                <h1 class="formHeroTitle" data-i18n="contact_title">Tell me what you&apos;re trying to automate.</h1>
                <p class="formHeroText" data-i18n-html="contact_text">
                    Share your stack, bottleneck, and project type. Or reach out directly on <a href="https://wa.me/573142023012" target="_blank" rel="noopener noreferrer">WhatsApp</a> or <a href="https://www.linkedin.com/in/camargo-jose" target="_blank" rel="noopener noreferrer">LinkedIn</a>.
                </p>

                <div class="contactFields">
                    <label class="fieldStack">
                        <span data-i18n="contact_name_label">Full Name</span>
                        <div class="inputShell">
                            <i class="bi bi-person"></i>
                            <input type="text" name="name" placeholder="Enter your full name" data-i18n-placeholder="contact_name_placeholder" required>
                        </div>
                    </label>

                    <label class="fieldStack">
                        <span data-i18n="contact_company_label">Company</span>
                        <div class="inputShell">
                            <i class="bi bi-buildings"></i>
                            <input type="text" name="company" placeholder="Enter your company name" data-i18n-placeholder="contact_company_placeholder">
                        </div>
                    </label>

                    <label class="fieldStack">
                        <span data-i18n="contact_email_label">Email Address</span>
                        <div class="inputShell">
                            <i class="bi bi-envelope"></i>
                            <input type="email" name="email" placeholder="Enter your email address" data-i18n-placeholder="contact_email_placeholder" required>
                        </div>
                    </label>

                    <label class="fieldStack">
                        <span data-i18n="contact_phone_label">WhatsApp</span>
                        <div class="inputShell">
                            <i class="bi bi-whatsapp"></i>
                            <input type="text" name="phone" placeholder="Enter your WhatsApp number" data-i18n-placeholder="contact_phone_placeholder">
                        </div>
                    </label>

                    <label class="fieldStack">
                        <span data-i18n="contact_stack_label">Current Stack / CRM</span>
                        <div class="inputShell">
                            <i class="bi bi-diagram-3"></i>
                            <input type="text" name="currentStack" placeholder="Example: HubSpot, GHL, Excel, WhatsApp, forms" data-i18n-placeholder="contact_stack_placeholder">
                        </div>
                    </label>

                    <label class="fieldStack">
                        <span data-i18n="contact_project_type_label">Project Type</span>
                        <div class="inputShell">
                            <i class="bi bi-kanban"></i>
                            <select name="projectType" required>
                                <option value="" disabled selected data-i18n="contact_project_type_default">Select project type</option>
                                <option value="ai-voice" data-i18n="contact_project_type_option_1">AI Voice Qualification</option>
                                <option value="crm-automation" data-i18n="contact_project_type_option_2">CRM Automation</option>
                                <option value="whatsapp-messaging" data-i18n="contact_project_type_option_3">WhatsApp / Messaging</option>
                                <option value="internal-ops" data-i18n="contact_project_type_option_4">Internal Ops Automation</option>
                                <option value="integrations-infra" data-i18n="contact_project_type_option_5">Integrations / Infrastructure</option>
                            </select>
                        </div>
                    </label>

                    <label class="fieldStack fieldStackFull">
                        <span data-i18n="contact_message_label">Main Bottleneck</span>
                        <textarea name="message" rows="5"
                            placeholder="What is slowing the operation down right now?" data-i18n-placeholder="contact_message_placeholder" required></textarea>
                    </label>
                </div>

                <div class="captchaWrap">
                    <div id="recaptchaMount"></div>
                    <p class="captchaNote" id="captchaNote" data-i18n="contact_captcha_note">reCAPTCHA will appear here once the site key is added.</p>
                </div>

                <div class="formActions formActionsCentered">
                    <button class="primaryCta contactSubmit" type="submit" id="contactSubmitButton">
                        <span data-i18n="contact_submit">Send Project Brief</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

                <p class="formStatus" id="contactStatus" hidden></p>
            </form>
        </section>

    </main>

    <footer>
        <ul class="pie">
            <li>
                <a href="https://www.linkedin.com/in/camargo-jose" target="_blank" rel="noopener noreferrer"><img
                        src="../img/social.png" alt="Imagen de linkedin" /></a>
            </li>
            <li>
                <a href="https://wa.me/573142023012" target="_blank" rel="noopener noreferrer"><img
                        src="../img/whatsapp.png" alt="Imagen de Whatsapp" /></a>
            </li>
            <li>
                <a href="https://github.com/joseCamargo12" target="_blank" rel="noopener noreferrer"><img
                        src="../img/github.png" alt="Imagen de GitHub" /></a>
            </li>
        </ul>
    </footer>

    <script src="../js/script.js"></script>
</body>

</html>
